[project]
name = "pharmcow"
version = "0.1.0"
description = "Personal PGx report generator: VCF -> star alleles (pypgx) -> CPIC report"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "python-multipart>=0.0.9",
    "weasyprint>=62",
    "pysam>=0.22",
]

[project.optional-dependencies]
star = ["pypgx==0.27.0", "pandas>=2.2,<3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
pharmcow = "pharmcow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharmcow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
